plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "vanilla-backrooms" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    // Polymer
    exclusiveContent {
        forRepository {
            repositories.maven {
                name = "Neucleoid's Maven"
                url = "https://maven.nucleoid.xyz"
            }
        } filter {
            includeGroup "xyz.nucleoid"
            includeGroup "eu.pb4"
            includeGroup "com.llamalad7.mixinextras"
        }
    }
    // REI
    exclusiveContent {
        forRepository {
            repositories.maven {
                name = "Shedaniel's Maven"
                url = "https://maven.shedaniel.me/"
            }
        } filter {
            includeGroup "me.shedaniel"
            includeGroup "me.shedaniel.cloth"
            includeGroup "dev.architectury"
        }
    }
    // Modmenu
    exclusiveContent {
        forRepository {
            repositories.maven {
                name = "Terraformers"
                url = "https://maven.terraformersmc.com/"
            }
        } filter {
            includeGroup "dev.emi"
            includeGroup "com.terraformersmc"
        }
    }
    // Jade & Sodium
    exclusiveContent {
        forRepository {
            repositories.maven {
                name = "Modrinth Maven"
                url = "https://api.modrinth.com/maven"
            }
        } filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "eu.pb4:polymer-bundled:${project.polymer_version}"

    // better Dev Environment //
    modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"                 // ModMenu
    modLocalRuntime "maven.modrinth:sodium:${project.sodium_version}"                       // Sodium
    modLocalRuntime "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"         // REI
    modLocalRuntime "dev.architectury:architectury-fabric:${project.architectury_version}"  // architectury required by REI
    modLocalRuntime "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"// cloth config required by REI
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", minecraft_version
    inputs.property "loader_version", loader_version
    inputs.property "fabric_api_version", fabric_api_version
    inputs.property "polymer_version", polymer_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": minecraft_version,
                "loader_version": loader_version,
                "fabric_api_version": fabric_api_version,
                "polymer_version": polymer_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}"}
    }

    archiveVersion = project.version + "+" + project.minecraft_version
}

sourcesJar {
    archiveVersion = project.version + "+" + project.minecraft_version
}

remapJar {
    archiveVersion = project.version + "+" + project.minecraft_version
}

remapSourcesJar {
    archiveVersion = project.version + "+" + project.minecraft_version
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            groupId = project.maven_group
            artifactId = project.archives_base_name
            version = project.mod_version

            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
